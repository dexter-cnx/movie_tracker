name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare environment file
        run: |
          mkdir -p assets
          test -f assets/.env || printf 'TMDB_BEARER_TOKEN=\n' > assets/.env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        env:
          COVERAGE_MIN: '55'
        run: |
          awk -F: -v min="$COVERAGE_MIN" '
            /^LF:/{found+=$2}
            /^LH:/{hit+=$2}
            END {
              pct=(found==0?0:hit*100/found)
              printf "Line coverage: %.2f%% (minimum %s%%)\n", pct, min
              if (pct+0.0001 < min) exit 1
            }
          ' coverage/lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
