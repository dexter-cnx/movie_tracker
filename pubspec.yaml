name: popcorn_movie_tracker
description: Popcorn - Movie Tracker & Watchlist demo app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  easy_localization: ^3.0.7+1
  easy_localization_loader: ^2.0.2
  flutter_dotenv: ^5.2.1
  fl_chart: ^0.71.0
  cached_network_image: ^3.4.1
  youtube_player_flutter: ^9.1.1
  go_router: ^14.8.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  csv: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/langs/
    - assets/.env
